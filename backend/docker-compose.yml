version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: spatial_eye_postgres
    environment:
      POSTGRES_USER: spatial
      POSTGRES_PASSWORD: eye_secret
      POSTGRES_DB: spatial_eye_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spatial -d spatial_eye_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: spatial_eye_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://spatial:eye_secret@postgres:5432/spatial_eye_db
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
