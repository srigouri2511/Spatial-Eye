services:
  - type: web
    name: spatial-eye-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spatial-eye-postgres
          property: connectionString

databases:
  - name: spatial-eye-postgres
    databaseName: spatial_eye_db
    user: spatial
    plan: free
