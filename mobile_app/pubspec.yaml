name: spatial_eye
description: Voice-Guided Navigation App for the Visually Impaired with Real-Time Danger Classification and Scene Recognition.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  flutter_tts: ^4.0.2
  audioplayers: ^6.1.0
  provider: ^6.1.1
  vector_math: ^2.1.4
  camera: ^0.12.0+2
  google_mlkit_object_detection: ^0.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
