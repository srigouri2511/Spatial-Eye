name: Build Spatial Eye APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile_app
          flutter build apk --release --dart-define=API_BASE_URL=https://spatial-eye-api.onrender.com/api/v1

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spatial-Eye-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
