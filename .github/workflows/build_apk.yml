name: Build Spatial Eye APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: mobile_app
        shell: bash
        run: |
          set +e
          flutter build apk --release 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "Build failed - full log:"
            cat build.log
            git config --global user.name "github-actions"
            git config --global user.email "github-actions@github.com"
            git checkout main
            git add build.log
            git commit -m "chore: upload build.log for debugging"
            git push origin main
            exit "$BUILD_EXIT"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spatial-Eye-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
