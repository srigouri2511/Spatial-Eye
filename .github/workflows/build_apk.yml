name: Build Spatial Eye APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: mobile_app
        run: |
          flutter build apk --release > build_log.txt 2>&1 || (flutter build apk --release --verbose >> build_log.txt 2>&1)
          if [ $? -ne 0 ]; then
            git config --global user.name "github-actions"
            git config --global user.email "github-actions@github.com"
            git add build_log.txt
            git commit -m "Upload failed build log"
            git push
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spatial-Eye-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
